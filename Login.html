<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Sound - Login</title>
</head>
<body style="font-family:Arial, sans-serif; background:#0a0a0f; color:#f2f2f2;">
  <br><br>
  <table align="center" width="80%" cellpadding="2" cellspacing="10">
    <tr>
      <td>
        <img src="Logo.png" alt="LOGO" width="70" align="right">
      </td>
      <td>
        <h3 style="color:#1ed760;">Mood Sound</h3>
        <p style="color:#bbbbbb;">Login to continue and choose your mood</p>
      </td>
    </tr>
    <tr style="background-color: #1a1a1a;">
      <td colspan="2">
        <table width="100%">
          <tr>
            <td colspan="2">
              <h2 style="color:#1ed760;">&nbsp;&nbsp;Login</h2>
              <p style="color: #bbbbbb;">&nbsp;&nbsp;&nbsp;Welcome back — sign in to your account.</p>
            </td>
          </tr>
          <tr>
            <td align="center">
              <input type="text" id="username" placeholder="Username or Email" style="width: 95%; padding:6px; background:#2a2a2a; color:#fff;">
            </td>
            <td align="center">
              <input type="password" id="password" placeholder="Password" style="width: 95%; padding:6px; background:#2a2a2a; color:#fff;">
            </td>
          </tr>

          <tr>
            <td colspan="2" style="color:#bbbbbb;">
              &nbsp;&nbsp;<input type="checkbox" id="remember" value="yes">&nbsp;&nbsp;
              <label for="remember">Remember me</label>
            </td>
          </tr>

          <tr>
            <td colspan="2">
              <br>
              &nbsp;&nbsp;&nbsp;&nbsp;<a href="#mood"><input type="button" id="btn" value="Login" style="padding:8px 14px; background:#1ed760; color:white;"></a>
            </td>
          </tr>

          <tr>
            <td colspan="2">
              <br>
              <h4 style="color: #bbbbbb;">&nbsp;&nbsp;Choose your mood after login</h4>
            </td>
          </tr>

          <tr>
            <td colspan="2" align="center">
              <a href="Chill Mood.html"><img src="chill.png" alt="Chill Mood" width="310"></a>&nbsp;
              <a href="Energetic Mood.html"><img src="energetic.png" alt="Energetic Mood" width="310"></a>&nbsp;
              <a href="bad mood.html"><img src="bad.png" alt="Bad Mood" width="310"></a>
            </td>
          </tr>

          <tr>
            <td colspan="2" align="center">
              <br>
              <p style="color:#1ed760;" id="mood">Chosen mood will be applied to your space after login.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
